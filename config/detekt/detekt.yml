# detekt overrides — merged on top of the bundled default config
# (buildUponDefaultConfig = true). Run: ./gradlew detekt

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

formatting:
  active: true
  android: true
  MaximumLineLength:
    maxLineLength: 120
  ArgumentListWrapping:
    active: false
  Wrapping:
    active: false

comments:
  active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

complexity:
  active: true
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInFiles: 25
  CyclomaticComplexMethod:
    threshold: 20

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 6
  UnusedPrivateMember:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
